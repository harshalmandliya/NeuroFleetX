version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: neurofleetx-postgres
    environment:
      POSTGRES_DB: neurofleetx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neurofleetx-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurofleetx-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/neurofleetx
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - postgres
    networks:
      - neurofleetx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurofleetx-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - neurofleetx-network

volumes:
  postgres_data:

networks:
  neurofleetx-network:
    driver: bridge